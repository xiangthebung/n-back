<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5da38a" />
      <stop offset="100%" stop-color="#7297cc" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- 3x3 Memory Grid Nodes -->
  <rect x="116" y="116" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="218" y="116" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="320" y="116" width="76" height="76" rx="20" fill="url(#nodeActive)" filter="url(#glowFilter)"/>

  <rect x="116" y="218" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="218" y="218" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="320" y="218" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <rect x="116" y="320" width="76" height="76" rx="20" fill="url(#nodeGlow)"/>
  <rect x="218" y="320" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="320" y="320" width="76" height="76" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <!-- Stylized N Connector -->
  <path d="M 154 358 L 154 154 L 358 358 L 358 154" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
</svg>
